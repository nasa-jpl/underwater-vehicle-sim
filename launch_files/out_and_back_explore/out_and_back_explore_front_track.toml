planner_type = "OutAndBackExplore"
start_phase = "explore"

min_depth = 4
max_depth = 17
hold_depth = 15

out_of_range_time = 600
beacon_estimate_expire_time = 1200
range_wait_time = 600
ranging_pattern_replan_time = 0.25
ranging_pattern_time = 1000
action_timeout = 43200
pattern_size = 150

num_monitor_ranges = 10
homing_restart_threshold = 0.2
monitor_homing_replan_time = 0.5

explore_distance = 3000
explore_heading_degrees = 270
explore_restart_threshold = 0.2

operation_region.min.x = -20000
operation_region.min.y = -20000
operation_region.min.z = 0
operation_region.max.x = 20000
operation_region.max.y = 20000
operation_region.max.z = 200


#Front Detection Parameters
do_front_tracking = true
front_tracking_transect_length = 1000
num_single_front_tracking_transects = 2
max_front_tracking_for_explore = 1
vthi_depths = [5,10,15]
vthi_threshold = 0.3
entries_for_front_detection = 2

#Single Beacon Navigation Filter Parameters
filter_names = ["sb1","sb2","sb3","sb4"]
main_filter = "sb1"

##Default Filter Parameters
correct_beacon_slant = true
beacon_depth = 15
automatic_optimization = false
initial_position_sigma = 1
initial_heading_sigma = 0.0174533

max_ranges = 100

beacon_range = -1
beacon_bearing_range = -1

velocity_timeout = 5
default_linear_velocity_sigma = 0.6
velocity_mode = "best"

weighted_optimization = false
xy_process_noise = 0
heading_process_noise = 0.00007615442 #0.5 deg sigma
xy_vel_process_noise = 0.01
ang_vel_process_noise = 0.0000000304 #0.1 deg/secong sigma

median_filter_bin_size = 5
range_filter_type = "offset_fix_median"

use_heading = true

##sb1
sb1.velocity_mode = "best"
sb1.use_heading = true

##sb2
sb2.velocity_mode = "best"
sb2.use_heading = false

##sb3
sb3.velocity_mode = "prop"
sb3.use_heading = true

##sb4
sb4.velocity_mode = "prop"
sb4.use_heading = false